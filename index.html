<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>GYXGAME Posting</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GYXGAME">
<meta name="theme-color" content="#0f0f10">
<style>
:root {
  --bg: #f4f4f2; --card: #ffffff; --text: #151515; --muted: #6b6b6b;
  --line: #e2e2de; --accent: #ff6a2b; --accent-text: #ffffff; --ok: #1f9d55; --soft: #ececea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f10; --card: #1a1a1c; --text: #f1f1f1; --muted: #9a9a9a;
    --line: #2c2c30; --accent: #ff7a3d; --accent-text: #111111; --ok: #3ccf7c; --soft: #242428;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 520px; overflow-x: hidden; margin: 0 auto; padding: 16px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
header h1 { font-size: 15px; letter-spacing: .08em; margin: 0; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); font-size: 14px; }
.tabs { display: flex; background: var(--soft); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
.tabs button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
  font-size: 15px; font-weight: 700; }
.tabs button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
.chips button { flex: 0 0 auto; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-size: 14px; }
.chips button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.nav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.nav button { flex: 0 0 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-size: 20px; }
.nav button:disabled { opacity: .35; }
.day { flex: 1; text-align: center; }
.day b { display: block; font-size: 18px; }
.day span { font-size: 13px; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.game { font-size: 20px; font-weight: 800; margin: 0 0 2px; }
.kp { color: var(--muted); font-size: 14px; margin: 0; }
.times { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; font-size: 14px; }
.times b { font-weight: 700; }
.strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 12px -14px 0; padding: 0 14px 4px; }
.strip a { flex: 0 0 42%; scroll-snap-align: start; }
.strip img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 10px; display: block; background: var(--line); }
.btn { display: block; width: 100%; min-height: 50px; border: 0; border-radius: 12px; margin-top: 12px;
  background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin: 0 0 6px; }
.text { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 15px; }
.done { display: flex; align-items: center; gap: 12px; font-weight: 600; }
.done input { width: 24px; height: 24px; accent-color: var(--ok); }
.done.on { color: var(--ok); }
.hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
/* calendar */
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 4px 0; }
.cell { position: relative; min-width: 0; aspect-ratio: 3/4; border-radius: 8px; background: var(--soft); border: 0; padding: 0;
  overflow: hidden; color: var(--text); font: inherit; }
.cell.blank { background: transparent; }
.cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; }
.cell .n { position: absolute; top: 3px; left: 5px; font-size: 12px; font-weight: 800; z-index: 1;
  text-shadow: 0 0 3px rgba(0,0,0,.6); }
.cell.has .n { color: #fff; }
.cell.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.cell.past.has img { filter: grayscale(.6) brightness(.7); }
.cell .ok { position: absolute; right: 3px; bottom: 3px; width: 16px; height: 16px; border-radius: 50%; z-index: 1;
  background: var(--ok); color: #fff; font-size: 11px; line-height: 16px; text-align: center; font-weight: 800; }
.agenda { list-style: none; margin: 0; padding: 0; }
.agenda li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.agenda li:first-child { border-top: 0; }
.agenda button { all: unset; display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; min-width: 0; }
.agenda img { width: 36px; height: 48px; object-fit: cover; border-radius: 6px; background: var(--soft); flex: 0 0 auto; }
.agenda .t { min-width: 0; }
.agenda .t b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agenda .t span { font-size: 13px; color: var(--muted); }
.agenda .st { font-size: 13px; font-weight: 700; color: var(--muted); flex: 0 0 auto; }
.agenda .st.ok { color: var(--ok); }
.code { font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; background: var(--soft);
  padding: 10px; border-radius: 10px; margin: 8px 0 0; }
.head-right { display: flex; align-items: center; gap: 10px; }
.pill { min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; }
.pill:hover { border-color: var(--text); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.cell .g { display: none; }
/* prepare a week: TikTok drafts + scheduled Reels */
.prep { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.prep .card { margin: 0; }
.steps { margin: 0; padding-left: 20px; font-size: 14px; }
.steps li { margin: 2px 0; }
.head { display: flex; align-items: center; gap: 12px; }
.head img { width: 54px; height: 72px; object-fit: cover; border-radius: 8px; background: var(--soft); flex: 0 0 auto; }
.head .t { min-width: 0; }
.head .t b { display: block; font-size: 17px; }
.head .t span { font-size: 13px; color: var(--muted); }
.part { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
.part .when { font-size: 14px; margin: 0 0 8px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.pair .btn { margin-top: 0; min-height: 46px; font-size: 15px; }
.reel { width: 42%; aspect-ratio: 9/16; border-radius: 10px; display: block; background: var(--line); margin-top: 12px; }
/* laptop: calendar left, selected day right */
@media (min-width: 960px) {
  main { max-width: 1480px; padding: 24px 32px 48px; }
  header h1 { font-size: 17px; }
  .tabs { max-width: 420px; }
  .tabs [data-tab="cal"] { display: none; }
  .tabs button { cursor: pointer; }
  .split { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(400px, 1fr); gap: 24px; align-items: start; }
  .col-day { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 4px; }
  .grid { gap: 8px; }
  .cell { aspect-ratio: 4/5; border-radius: 10px; cursor: pointer; }
  .cell .n { font-size: 15px; top: 6px; left: 8px; }
  .cell .g { display: block; position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: 18px 8px 6px;
    font-size: 12px; font-weight: 700; color: #fff; text-align: left; line-height: 1.2;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell .ok { width: 20px; height: 20px; line-height: 20px; font-size: 12px; top: 6px; right: 6px; bottom: auto; }
  .cell.has:hover img { filter: brightness(1.1); }
  .cell.sel { outline: 3px solid var(--text); outline-offset: 2px; }
  .agenda li { padding: 10px 8px; }
  .agenda li.sel { background: var(--soft); border-radius: 10px; }
  .col-day .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: visible; margin: 12px 0 0; padding: 0; }
  .col-day .strip a { flex: none; }
  .btn { cursor: pointer; }
}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" class="toast"></div>
<script>
const DAYS = ["Min", "Sen", "Sel", "Rab", "Kam", "Jum", "Sab"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
const MONTHS_LONG = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
const app = document.getElementById("app");
let all = [], posts = [], idx = 0, tab = "day", persona = "", month = null, week = "", folderName = "";

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const flag = (kind, p) => !!store.get(kind + ":" + p.id);  // done = TikTok posted, draft = in TikTok Drafts, reel = Reel scheduled
const isDone = p => flag("done", p);
function iso(d) { return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
const todayISO = () => iso(new Date());
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1800);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  toast("Tersalin ✓");
}

/* A post's time is wall-clock time in its own timezone (e.g. 19:00 New York); show it in the viewer's time. */
function postInstant(p, time) {
  const [y, m, d] = p.date.split("-").map(Number), [h, mi] = (time || p.time || "12:00").split(":").map(Number);
  const tz = p.tz || "America/New_York", guess = Date.UTC(y, m - 1, d, h, mi);
  const offset = t => {
    const parts = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23",
      year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
      .formatToParts(new Date(t)).map(x => [x.type, x.value]));
    return Date.UTC(+parts.year, parts.month - 1, +parts.day, +parts.hour, +parts.minute) - t;
  };
  let t = guess - offset(guess);
  return new Date(guess - offset(t));
}
const clock = d => d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
const localTime = p => clock(p.at);
const dayLabel = d => `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
async function saveFiles(list, type, what) {
  toast(`Menyiapkan ${what}…`);
  try {
    const files = await Promise.all(list.map(async ([src, name]) => new File([await (await fetch(src)).blob()], name, { type })));
    // phone: the share sheet has "Save image/video"; on a PC it opens the OS share dialog, so download there instead
    if (isPhone() && navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files }); return; }
    // browsers drop downloads fired in the same instant, so start them one by one
    for (const f of files) {
      const a = document.createElement("a"), url = URL.createObjectURL(f);
      a.href = url; a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      await new Promise(r => setTimeout(r, 700));
    }
    toast(what[0].toUpperCase() + what.slice(1) + " diunduh");
  } catch (e) {
    if (e.name !== "AbortError") toast("Gagal, tekan lama untuk simpan");
  }
}
const isPhone = () => (navigator.userAgentData && navigator.userAgentData.mobile) ||
  /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

/* PC (Chrome/Edge): write the files straight into a folder the viewer picks once. The folder is remembered in
   IndexedDB; the browser may ask again for permission in a new session. */
const canFolder = () => !isPhone() && "showDirectoryPicker" in window;
const folderDB = () => new Promise((res, rej) => {
  const r = indexedDB.open("gyxgame", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function savedFolder() {
  try {
    const db = await folderDB();
    return await new Promise(res => {
      const q = db.transaction("kv").objectStore("kv").get("dir");
      q.onsuccess = () => res(q.result || null); q.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function rememberFolder(dir) {
  try { (await folderDB()).transaction("kv", "readwrite").objectStore("kv").put(dir, "dir"); } catch (e) {}
}
async function pickFolder(fresh) {
  let dir = fresh ? null : await savedFolder();
  if (dir) {
    const ok = (await dir.queryPermission({ mode: "readwrite" })) === "granted" ||
               (await dir.requestPermission({ mode: "readwrite" })) === "granted";
    if (!ok) dir = null;
  }
  if (!dir) {
    dir = await showDirectoryPicker({ id: "gyxgame", mode: "readwrite", startIn: "pictures" });
    await rememberFolder(dir);
    folderName = dir.name; render();  // header shows the folder name
  }
  return dir;
}
async function saveToFolder(list, what) {
  const dir = await pickFolder();
  toast(`Menyimpan ${what}…`);
  for (const [src, name] of list) {
    const blob = await (await fetch(src)).blob();
    const w = await (await dir.getFileHandle(name, { create: true })).createWritable();
    await w.write(blob); await w.close();
  }
  toast(`${list.length} file tersimpan di folder ${dir.name}`);
}
async function saveList(list, type, what, zip) {
  if (canFolder()) {
    try { return await saveToFolder(list, what); }
    catch (e) { if (e.name === "AbortError") return; }  // otherwise fall back below
  }
  if (!isPhone() && zip) {  // PC without folder access: several downloads from one click get dropped, one zip never does
    const a = document.createElement("a"); a.href = zip; a.download = zip.split("/").pop();
    document.body.appendChild(a); a.click(); a.remove();
    return toast(`ZIP diunduh (${list.length} foto)`);
  }
  return saveFiles(list, type, what);
}
const saveImages = p => saveList(p.images.map((src, i) => [src, `${p.date}_${p.slug}_${i + 1}.jpg`]), "image/jpeg", "gambar", p.zip);
const saveReel = p => saveList([[p.reel.video, `${p.date}_${p.slug}_reel.mp4`]], "video/mp4", "video");
/* Weeks run Monday to Sunday in the viewer's time. */
function weekOf(p) {
  const d = new Date(p.day + "T00:00:00");
  d.setDate(d.getDate() - (d.getDay() + 6) % 7);
  return iso(d);
}

const wide = matchMedia("(min-width: 960px)");

function shell(inner) {
  const personas = [...new Set(all.map(p => p.persona || "clean"))];
  const count = posts.filter(isDone).length;
  app.innerHTML = `
    <header><h1>GYXGAME · POSTING</h1><span class="head-right">${isPhone() ? ""
      : `<button class="pill" id="folder">📁 ${folderName ? "Folder: " + esc(folderName) + " · ganti" : "Pilih folder simpan"}</button>`}
      <span class="muted">${count}/${posts.length} TikTok</span></span></header>
    <div class="tabs"><button data-tab="day" class="${tab === "day" ? "on" : ""}">Hari ini</button>
      <button data-tab="cal" class="${tab === "cal" ? "on" : ""}">Kalender</button>
      <button data-tab="prep" class="${tab === "prep" ? "on" : ""}">Siapin</button></div>
    ${personas.length > 1 ? `<div class="chips">${["", ...personas].map(x =>
      `<button data-persona="${esc(x)}" class="${x === persona ? "on" : ""}">${x ? esc(x) : "Semua"}</button>`).join("")}</div>` : ""}
    ${inner}`;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    tab = b.dataset.tab; history.replaceState(null, "", tab === "cal" ? "#kalender" : tab === "prep" ? "#siapin" : location.pathname); render();
  });
  app.querySelectorAll("[data-persona]").forEach(b => b.onclick = () => { persona = b.dataset.persona; filter(); render(); });
  const fb = document.getElementById("folder");
  if (fb) fb.onclick = () => canFolder()
    ? pickFolder(true).then(d => toast("Foto dan video disimpan ke " + d.name)).catch(() => {})
    : toast("Browser ini nggak bisa simpan ke folder. Pakai Chrome atau Edge; di sini foto diunduh sebagai ZIP.");
}

function dayHTML() {
  if (!posts.length) return '<p class="empty">Belum ada postingan.</p>';
  const p = posts[idx], d = new Date(p.day + "T00:00:00");
  const diff = Math.round((d - new Date(todayISO() + "T00:00:00")) / 86400000);
  const rel = diff === 0 ? "Hari ini" : diff === 1 ? "Besok" : diff === -1 ? "Kemarin" : diff > 0 ? `${diff} hari lagi` : `${-diff} hari lalu`;
  const done = isDone(p);
  return `
    <div class="nav">
      <button id="prev" aria-label="Sebelumnya" ${idx === 0 ? "disabled" : ""}>‹</button>
      <div class="day"><b>${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}</b><span>${rel}${p.persona && p.persona !== "clean" ? " · " + esc(p.persona) : ""}</span></div>
      <button id="next" aria-label="Berikutnya" ${idx === posts.length - 1 ? "disabled" : ""}>›</button>
    </div>
    <div class="card">
      <p class="game">${esc(p.game)}</p>
      ${p.key_point ? `<p class="kp">${esc(p.key_point)}</p>` : ""}
      <div class="times">
        <span>🕖 Posting TikTok dari Drafts sekitar jam <b>${esc(localTime(p))}</b></span>
        <span class="muted">Carousel IG + Threads tayang otomatis di jam yang sama</span>
      </div>
      <div class="strip">${p.images.map((s, i) => `<a href="${esc(s)}" target="_blank"${isPhone() ? "" : ` download="${esc(p.date + "_" + p.slug + "_" + (i + 1))}.jpg"`}><img src="${esc(s)}" alt="" loading="lazy"></a>`).join("")}</div>
      <button class="btn" id="save">💾 Simpan ${p.images.length} gambar</button>
      <p class="hint">${isPhone() ? 'Pilih "Simpan gambar" di menu share. Kalau nggak muncul, tekan lama tiap gambar.' : (canFolder() ? "Di PC keempat foto langsung disimpan ke folder pilihan lu." : "Di PC keempat foto diunduh sebagai satu file ZIP.") + " Klik satu gambar untuk mengunduhnya sendiri."}</p>
    </div>
    ${p.title ? `<div class="card"><p class="label">Judul (maks 90)</p><p class="text">${esc(p.title)}</p>
      <button class="btn ghost" id="copyTitle">📋 Copy judul</button></div>` : ""}
    <div class="card"><p class="label">Caption</p><p class="text">${esc(p.caption)}</p>
      <button class="btn" id="copyCap">📋 Copy caption</button></div>
    <div class="card">
      <label class="done ${done ? "on" : ""}"><input type="checkbox" id="done" ${done ? "checked" : ""}> Sudah diposting di TikTok</label>
      <p class="hint">Jangan lupa pilih sound yang lagi trending.</p>
    </div>
    ${p.reel ? `<div class="card"><p class="label">Reels Instagram</p>
      <p class="kp">Jadwalkan di app IG: <b>${esc(dayLabel(p.reelAt))} · ${esc(clock(p.reelAt))}</b>, tambah lagu di sana.</p>
      <video class="reel" src="${esc(p.reel.video)}" poster="${esc(p.images[0])}" preload="none" controls muted playsinline></video>
      <div class="pair" style="margin-top:12px"><button class="btn" id="saveReel">💾 Video</button>
        <button class="btn ghost" id="copyReel">📋 Caption</button></div>
      <label class="done ${flag("reel", p) ? "on" : ""}"><input type="checkbox" id="reelDone" ${flag("reel", p) ? "checked" : ""}> Reels sudah dijadwal</label>
      <p class="hint">Setelah tayang: buka Reels-nya, ⋯ → Remove from profile grid (isinya sama dengan carousel).</p>
    </div>` : ""}`;
}

function bindDay() {
  const p = posts[idx];
  if (!p) return;
  const go = i => {
    idx = i; month = [posts[i].at.getFullYear(), posts[i].at.getMonth()];
    render(); if (!wide.matches) scrollTo(0, 0);
  };
  document.getElementById("prev").onclick = () => idx > 0 && go(idx - 1);
  document.getElementById("next").onclick = () => idx < posts.length - 1 && go(idx + 1);
  document.getElementById("save").onclick = () => saveImages(p);
  document.getElementById("copyCap").onclick = () => copy(p.caption);
  const ct = document.getElementById("copyTitle"); if (ct) ct.onclick = () => copy(p.title);
  document.getElementById("done").onchange = e => { store.set("done:" + p.id, e.target.checked ? "1" : ""); render(); };
  if (p.reel) {
    document.getElementById("saveReel").onclick = () => saveReel(p);
    document.getElementById("copyReel").onclick = () => copy(p.reel.caption);
    document.getElementById("reelDone").onchange = e => { store.set("reel:" + p.id, e.target.checked ? "1" : ""); render(); };
  }
}

/* One sitting per week: save every TikTok post to Drafts and schedule every Reel in the Instagram app. */
function prepHTML() {
  if (!posts.length) return '<p class="empty">Belum ada postingan.</p>';
  const keys = [...new Set(posts.map(weekOf))];
  if (!keys.includes(week)) week = weekOf(posts[idx]);
  const k = keys.indexOf(week), list = posts.filter(p => weekOf(p) === week);
  const a = new Date(week + "T00:00:00"), b = new Date(a); b.setDate(a.getDate() + 6);
  const range = a.getMonth() === b.getMonth() ? `${a.getDate()} – ${b.getDate()} ${MONTHS[b.getMonth()]}`
    : `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}`;
  const reels = list.filter(p => p.reel);
  const cards = list.map(p => {
    const i = posts.indexOf(p), draft = flag("draft", p), reel = flag("reel", p);
    return `<div class="card">
      <div class="head"><img src="${esc(p.images[0])}" alt="" loading="lazy">
        <span class="t"><b>${esc(dayLabel(p.at))}</b><span>${esc(p.game)}${p.persona && p.persona !== "clean" ? " · " + esc(p.persona) : ""}</span></span></div>
      <div class="part"><p class="label">TikTok</p>
        <p class="when">Simpan ke Drafts, post jam <b>${esc(localTime(p))}</b></p>
        <div class="pair"><button class="btn" data-act="imgs" data-i="${i}">💾 ${p.images.length} foto</button>
          <button class="btn ghost" data-act="cap" data-i="${i}">📋 Caption</button></div>
        <label class="done ${draft ? "on" : ""}"><input type="checkbox" data-flag="draft" data-i="${i}" ${draft ? "checked" : ""}> Sudah di Drafts</label></div>
      ${p.reel ? `<div class="part"><p class="label">Reels Instagram</p>
        <p class="when">Jadwalkan <b>${esc(dayLabel(p.reelAt))} · ${esc(clock(p.reelAt))}</b></p>
        <div class="pair"><button class="btn" data-act="vid" data-i="${i}">💾 Video</button>
          <button class="btn ghost" data-act="rcap" data-i="${i}">📋 Caption</button></div>
        <label class="done ${reel ? "on" : ""}"><input type="checkbox" data-flag="reel" data-i="${i}" ${reel ? "checked" : ""}> Sudah dijadwal</label></div>` : ""}
    </div>`;
  }).join("");
  return `
    <div class="nav">
      <button id="pw" aria-label="Minggu sebelumnya" ${k === 0 ? "disabled" : ""}>‹</button>
      <div class="day"><b>${range}</b><span>Drafts TikTok ${list.filter(p => flag("draft", p)).length}/${list.length}${reels.length
        ? ` · Reels ${reels.filter(p => flag("reel", p)).length}/${reels.length}` : ""}</span></div>
      <button id="nw" aria-label="Minggu berikutnya" ${k === keys.length - 1 ? "disabled" : ""}>›</button>
    </div>
    <div class="card"><ol class="steps">
      <li><b>TikTok:</b> simpan foto, buat post, pilih sound, tempel caption, lalu <b>Simpan ke Drafts</b>.</li>
      <li><b>Reels:</b> simpan video, buat Reels, pilih lagu, tempel caption, lalu <b>Jadwalkan</b> di jam yang tertulis.</li>
      <li>Tiap pagi tinggal tekan Post di Drafts TikTok.</li>
      <li>Setelah Reels tayang: buka Reels itu, <b>⋯ → Remove from profile grid</b>, supaya grid cuma berisi carousel.</li></ol></div>
    <div class="prep">${cards}</div>`;
}

function bindPrep() {
  const pw = document.getElementById("pw");
  if (!pw) return;
  const keys = [...new Set(posts.map(weekOf))], k = keys.indexOf(week);
  const go = i => { week = keys[i]; render(); scrollTo(0, 0); };
  pw.onclick = () => k > 0 && go(k - 1);
  document.getElementById("nw").onclick = () => k < keys.length - 1 && go(k + 1);
  const acts = { imgs: saveImages, cap: p => copy(p.caption), vid: saveReel, rcap: p => copy(p.reel.caption) };
  app.querySelectorAll("[data-act]").forEach(b => b.onclick = () => acts[b.dataset.act](posts[+b.dataset.i]));
  app.querySelectorAll("[data-flag]").forEach(c => c.onchange = () => {
    store.set(c.dataset.flag + ":" + posts[+c.dataset.i].id, c.checked ? "1" : ""); render();
  });
}

function calHTML() {
  const [y, m] = month;
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7, today = todayISO(), sel = wide.matches ? idx : -1;
  const byDate = {};
  posts.forEach((p, i) => (byDate[p.day] = byDate[p.day] || []).push(i));
  const key = d => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  let cells = ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"].map(x => `<div class="dow">${x}</div>`).join("");
  cells += '<div class="cell blank"></div>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const k = key(d), list = byDate[k] || [], p = list.length ? posts[list[0]] : null;
    const cls = ["cell", p ? "has" : "", k === today ? "today" : "", k < today ? "past" : "", list.includes(sel) ? "sel" : ""].join(" ");
    cells += `<button class="${cls}" ${p ? `data-i="${list[0]}"` : "disabled"} aria-label="${d} ${MONTHS_LONG[m]}${p ? ": " + esc(p.game) : ""}">
      ${p ? `<img src="${esc(p.images[0])}" alt="" loading="lazy">` : ""}<span class="n">${d}</span>
      ${p ? `<span class="g">${esc(p.game)}</span>` : ""}
      ${p && list.every(i => isDone(posts[i])) ? '<span class="ok">✓</span>' : ""}</button>`;
  }
  const monthPosts = posts.map((p, i) => [p, i]).filter(([p]) => p.day.startsWith(key(1).slice(0, 7)));
  const agenda = monthPosts.map(([p, i]) => {
    const d = new Date(p.day + "T00:00:00"), done = isDone(p);
    return `<li class="${i === sel ? "sel" : ""}"><button data-i="${i}"><img src="${esc(p.images[0])}" alt="" loading="lazy">
      <span class="t"><b>${esc(p.game)}</b><span>${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} · ${esc(localTime(p))}${p.persona && p.persona !== "clean" ? " · " + esc(p.persona) : ""}</span></span></button>
      <span class="st ${done ? "ok" : ""}">${done ? "✓ TikTok" : p.day < today ? "belum" : ""}</span></li>`;
  }).join("");
  return `
    <div class="nav">
      <button id="pm" aria-label="Bulan sebelumnya">‹</button>
      <div class="day"><b>${MONTHS_LONG[m]} ${y}</b><span>${monthPosts.length} postingan</span></div>
      <button id="nm" aria-label="Bulan berikutnya">›</button>
    </div>
    <div class="card"><div class="grid">${cells}</div></div>
    ${agenda ? `<div class="card"><ul class="agenda">${agenda}</ul></div>` : '<p class="empty">Belum ada jadwal bulan ini.</p>'}`;
}

function bindCal() {
  const [y, m] = month;
  document.getElementById("pm").onclick = () => { month = m === 0 ? [y - 1, 11] : [y, m - 1]; render(); };
  document.getElementById("nm").onclick = () => { month = m === 11 ? [y + 1, 0] : [y, m + 1]; render(); };
  app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    idx = +b.dataset.i;
    if (!wide.matches) { tab = "day"; scrollTo(0, 0); }
    render();
  });
}

/* Phone: one view with tabs. Laptop: calendar and the selected day side by side. */
function render() {
  if (tab === "prep") { shell(prepHTML()); bindPrep(); }
  else if (wide.matches) {
    shell(`<div class="split"><section class="col-cal">${calHTML()}</section><section class="col-day">${dayHTML()}</section></div>`);
    bindCal(); bindDay();
  } else if (tab === "cal") { shell(calHTML()); bindCal(); }
  else { shell(dayHTML()); bindDay(); }
}
wide.addEventListener("change", () => all.length && render());

function filter() {
  const cur = posts[idx];
  posts = all.filter(p => !persona || (p.persona || "clean") === persona);
  const since = Date.now() - 12 * 3600e3;
  idx = cur && posts.includes(cur) ? posts.indexOf(cur) : posts.findIndex(p => p.at.getTime() >= since);
  if (idx < 0) idx = Math.max(0, posts.length - 1);
}

/* Landing page for the Instagram / Threads login used by add_account.py */
const params = new URLSearchParams(location.search);
if (params.get("code")) {
  const code = params.get("code").split("#")[0], net = params.get("state") === "threads" ? "Threads" : params.get("state") === "instagram" ? "Instagram" : "Login";
  app.innerHTML = `<header><h1>GYXGAME · ${esc(net.toUpperCase())}</h1></header>
    <div class="card"><p class="game">✅ Kode ${esc(net)} diterima</p>
      <p class="kp">Copy kode ini lalu paste ke PowerShell yang sedang menunggu. Kode cuma berlaku sebentar.</p>
      <p class="code">${esc(code)}</p><button class="btn" id="cc">📋 Copy kode</button></div>`;
  document.getElementById("cc").onclick = () => copy(code);
  history.replaceState(null, "", location.pathname);
} else {
  fetch("posts.json", { cache: "no-store" }).then(r => r.json()).then(list => {
    list.forEach(p => {  // when and on which local day it goes out
      p.at = postInstant(p); p.day = iso(p.at);
      if (p.reel) p.reelAt = postInstant(p, p.reel.time);
    });
    all = list.sort((a, b) => a.at - b.at || (a.persona || "").localeCompare(b.persona || ""));
    filter();
    const focus = posts[idx] ? posts[idx].at : new Date();
    month = [focus.getFullYear(), focus.getMonth()];
    if (location.hash === "#kalender") tab = "cal";
    if (location.hash === "#siapin") tab = "prep";
    render();
    if (canFolder()) savedFolder().then(d => { if (d) { folderName = d.name; render(); } });
  }).catch(() => { app.innerHTML = '<p class="empty">Gagal memuat data.</p>'; });
}
</script>
